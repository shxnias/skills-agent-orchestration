<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-header__intro">
          <p class="eyebrow">MONA'S TEAM · WORKSPACE OVERVIEW</p>
          <h1>Project Pulse</h1>
          <p class="dashboard-header__description">A clear view of what’s moving, who’s making it happen, and where to focus next.</p>
        </div>
        <div class="dashboard-header__mark" aria-hidden="true">
          <span class="pulse-dot"></span>
          <span>TEAM PULSE</span>
        </div>
      </header>

      <section class="dashboard-overview" aria-label="Project overview">
        <div>
          <p class="section-kicker">THE BIG PICTURE</p>
          <h2>Projects at a glance</h2>
        </div>
        <p class="dashboard-overview__note"><span class="overview-dot" aria-hidden="true"></span> A little progress, every day.</p>
      </section>

      <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite">Loading projects…</p>
      <section id="project-grid" class="project-grid" aria-label="Projects" aria-busy="true"></section>
      <footer class="dashboard-footer">
        <span class="footer-pulse" aria-hidden="true"></span>
        <p>Good work happens when everyone knows what matters.</p>
      </footer>
    </main>

    <script>
      const projectGrid = document.querySelector("#project-grid");
      const dashboardMessage = document.querySelector("#dashboard-message");
      const requiredFields = ["name", "owner", "status", "recentActivity", "priority", "summary"];

      function showError(message) {
        dashboardMessage.textContent = message;
        dashboardMessage.classList.add("dashboard-message--error");
        projectGrid.setAttribute("aria-busy", "false");
      }

      function makeTextElement(tagName, className, text) {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function makeProjectCard(project) {
        const card = document.createElement("article");
        card.className = "project-card";

        const header = document.createElement("div");
        header.className = "project-card__header";
        const title = makeTextElement("h3", "project-card__name", project.name);
        header.append(title);

        const owner = document.createElement("p");
        owner.className = "project-card__owner";
        owner.append(makeTextElement("span", "project-card__owner-label", "PROJECT LEAD"));
        owner.append(document.createTextNode(project.owner));

        const summary = makeTextElement("p", "project-card__summary", project.summary);
        const meta = document.createElement("div");
        meta.className = "project-card__meta";

        const status = makeTextElement("span", "status-badge", project.status);
        status.dataset.status = project.status.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const priority = makeTextElement("span", "priority-badge", project.priority);
        priority.dataset.priority = project.priority.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        meta.append(status, priority);

        const activity = document.createElement("div");
        activity.className = "recent-activity";
        activity.append(makeTextElement("span", "recent-activity__label", "RECENT ACTIVITY"));
        activity.append(makeTextElement("p", "recent-activity__text", project.recentActivity));

        card.append(header, owner, summary, meta, activity);
        return card;
      }

      async function loadProjects() {
        try {
          const response = await fetch("project-data.json");
          if (!response.ok) {
            throw new Error(`Project data request failed (${response.status}).`);
          }

          const data = await response.json();
          if (!data || !Array.isArray(data.projects)) {
            throw new Error('Project data must contain a "projects" array.');
          }
          if (data.projects.some((project) =>
            !project || requiredFields.some((field) =>
              typeof project[field] !== "string" || project[field].trim() === ""
            )
          )) {
            throw new Error("One or more projects are missing required information.");
          }
          if (data.projects.length === 0) {
            throw new Error("No projects are available to display yet.");
          }

          const fragment = document.createDocumentFragment();
          data.projects.forEach((project) => fragment.append(makeProjectCard(project)));
          projectGrid.replaceChildren(fragment);
          dashboardMessage.remove();
          projectGrid.setAttribute("aria-busy", "false");
        } catch (error) {
          console.error("Unable to load Project Pulse data:", error);
          showError(`We couldn’t load the project list. ${error.message} Refresh the page to try again.`);
        }
      }

      loadProjects();
    </script>
  </body>
</html>
